name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Compilar APK
        run: gradle assembleDebug -PbuildNumber=${{ github.run_number }} --no-daemon --stacktrace

      - name: Renomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Ibamaman-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Ibamaman-${{ github.run_number }}
          path: Ibamaman-${{ github.run_number }}.apk

      - name: Publicar na pagina de Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Ibamaman (build ${{ github.run_number }})
          body: |
            APK de teste do Ibamaman
            Baixe o arquivo .apk abaixo no celular e instale (permita "instalar apps desconhecidos" se o Android pedir).
            Commit: ${{ github.sha }}
          files: Ibamaman-${{ github.run_number }}.apk
          make_latest: true
